# Starship configuration - Powerline-inspired with text colors only

# Two-line format: info line, then prompt
format = """
$directory$git_branch$git_status$git_state
$character"""

# Directory - full path with folder icon
[directory]
truncation_length = 100
truncate_to_repo = false
style = "bold cyan"
format = "[ $path](bold cyan) "
read_only = " 󰌾"
read_only_style = "bold red"

# Git branch
[git_branch]
symbol = ""
style = "bold purple"
format = "[│](dimmed white) [$branch]($style)"

# Git status - clean icons with individual colors for each type
[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = "bold red"
conflicted = "[󰞇 ${count}](bold red)"
ahead = "[⇡${count}](bold yellow)"
behind = "[⇣${count}](bold yellow)"
diverged = "[⇡${ahead_count}⇣${behind_count}](bold yellow)"
up_to_date = ""
untracked = "[U${count} ](bold red)"
stashed = "[󰏗 ${count} ](bold cyan)"
modified = "[M${count} ](bold yellow)"
staged = "[✓${count} ](bold green)"
renamed = "[󰖷 ${count} ](bold blue)"
deleted = "[D${count} ](bold red)"

# Git state (rebase, merge, etc.)
[git_state]
format = '[ \([$state( $progress_current/$progress_total)]($style)\)]'
style = "bold yellow"
rebase = "rebasing"
merge = "merging"
revert = "reverting"
cherry_pick = "cherry-picking"
bisect = "bisecting"
am = "am"
am_or_rebase = "am/rebase"

# Prompt character - changes color on error
[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Language/environment indicators (subtle, only show when relevant)
[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[ $symbol$version]($style)"
disabled = false

[python]
symbol = " "
style = "bold yellow"
format = "[ $symbol$version]($style)"
disabled = false

[rust]
symbol = " "
style = "bold red"
format = "[ $symbol$version]($style)"
disabled = false

[golang]
symbol = " "
style = "bold cyan"
format = "[ $symbol$version]($style)"
disabled = false

[java]
symbol = " "
style = "bold red"
format = "[ $symbol$version]($style)"
disabled = false

# Show command duration for slow commands
[cmd_duration]
min_time = 500
format = "[ 󱦟 $duration](bold yellow)"
disabled = false

# Disable package version by default (can be noisy)
[package]
disabled = true

# Docker context
[docker_context]
symbol = " "
format = "[ $symbol$context]($style)"
style = "bold blue"
disabled = false

# AWS context
[aws]
symbol = " "
format = "[ $symbol$profile]($style)"
style = "bold yellow"
disabled = false
