# Modern vim-style tmux configuration with Alt key bindings

# Change prefix from Ctrl+b to Ctrl+a (easier to reach, but rarely needed)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Pane navigation - vim style (Alt+h/j/k/l)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Pane splitting (Alt+| for vertical, Alt+- for horizontal)
bind-key -n M-/ split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

# Pane management
bind-key -n M-x kill-pane
bind-key -n M-z resize-pane -Z
bind-key -n M-R next-layout

# Window management
bind-key -n M-n new-window
bind-key -n M-X kill-window
bind-key -n M-W choose-window

# Window navigation - switch to window by number (Alt+q/w/e/r/t/y/u/i/o)
bind-key -n M-q select-window -t 1
bind-key -n M-w select-window -t 2
bind-key -n M-e select-window -t 3
bind-key -n M-r select-window -t 4
bind-key -n M-t select-window -t 5
bind-key -n M-y select-window -t 6
bind-key -n M-u select-window -t 7
bind-key -n M-i select-window -t 8
bind-key -n M-o select-window -t 9

# Window navigation - next/previous
bind-key -n M-( previous-window
bind-key -n M-) next-window

# Session management
bind-key -n M-S choose-session
bind-key -n M-D detach-client

# Enable mouse support (optional but helpful)
set -g mouse on

# Start window numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Catppuccin
set -g default-terminal "tmux-256color"
set -g @catppuccin_flavor "macchiato" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Catppuccin pane styling - enable pane status and customize colors
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "top"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_green}"
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_color "#{@thm_green}"
set -g @catppuccin_pane_background_color "#{@thm_surface_0}"
set -g @catppuccin_pane_default_text "#{b:pane_current_path}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100

# Override pane border colors after theme loads to ensure they take effect
# Active pane gets bright green border, inactive panes get subtle grey
set -g pane-border-style "fg=#{@thm_overlay_0}"
set -g pane-active-border-style "fg=#{@thm_green}"

# Show arrows/indicators on pane borders to make active pane more obvious
set -g pane-border-indicators "both"

# Gray background for unfocused panes via per-pane focus hooks
set -g focus-events on
set-hook -g pane-focus-in  'select-pane -P "bg=#{@thm_mantle}"'
set-hook -g pane-focus-out 'select-pane -P "bg=#{@thm_base}"'

# Enable pane border status bar at top showing current path
set -g pane-border-status top
# Active pane has green highlight, inactive panes are subdued
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_crust},bg=#{@thm_green},bold],#[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}]} #{pane_index} #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{b:pane_current_path} "
